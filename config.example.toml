# VinylCast configuration. Copy to vinylcast.toml and pass with --config.
# Every key can be overridden by a CLI flag of the same name (underscores -> dashes).
# Defaults are starting points, not decisions.

# Audio source: "alsa", "tone" or "file"
source = "alsa"

# ALSA capture device. Confirm on the Pi with `arecord -L`. hw: (no conversions) so an
# unsupported rate fails loudly instead of being resampled silently by ALSA.
alsa_device = "hw:CARD=CODEC,DEV=0"

# Path to an audio file; required when source = "file".
# source_file = "/path/to/test.flac"

# Tone source only: 0 = continuous 440 Hz; N > 0 = a 0.1 s beep every N seconds (latency checks).
tone_beep_s = 0

# Sample rate in Hz. UFO202 native capture rates (cat /proc/asound/CODEC/stream0):
# 48000, 44100, 32000, 22050, 16000, 11025.
sample_rate = 44100

# Codec: "mp3" (default, proven on both targets) or "flac". Both are kept (M6 decision);
# changing it needs a service restart.
codec = "mp3"
mp3_bitrate = "320k"

# HTTP port; binds on all interfaces.
http_port = 8800

# IP placed in the stream URL sent to the receiver. "auto" = interface on the default route.
advertise_ip = "auto"

# Friendly name of a Cast device or group.
# cast_target = "Living Room"

# Seconds of audio a client may lag before it is dropped.
client_max_buffer_s = 10

# Measure input levels inside the encoder's ffmpeg (100 ms blocks, ~+1.5 % CPU on a Pi 3).
# Needed for needle-drop detection and peak logging. Verified on the Pi (R0).
measure_levels = true

# Log the input peak every N seconds (needs measure_levels; 0 = off). The soak summary
# reports the loudest peak.
peak_log_s = 10

# JSONL metrics log. Use one file per soak-test run; strftime codes are expanded when the
# file is opened, e.g. "./soak-%Y%m%d-%H%M.jsonl".
metrics_path = "./metrics.jsonl"

# --- Revision 1: auto-cast on needle drop (docs/PLAN-rev1.md) ---
# The web UI may change auto_cast, the detection settings, codec and mp3_bitrate; its changes
# are stored in state.json and override this file (command-line flags override both).

# Cast to the last-used speaker when music is detected at the input.
auto_cast = true

# RMS level (dBFS) above which the input counts as music; "off" is 6 dB lower. From the R0
# noise floor: music -34..-25, groove noise up to -46/-50, stylus up -64..-55 dBFS.
detect_threshold_db = -40.0

# Music must last this long before casting (ignores clicks and handling noise).
detect_on_s = 1.5

# Silence this long stops playback (must be longer than a side flip).
stop_after_silence_s = 180.0

# Automatic re-casts allowed per 10 minutes after receiver errors.
recast_max = 3

# Persistent state: last speaker and settings changed in the web UI.
state_path = "./state.json"
