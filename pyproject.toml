[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinylcast"
version = "0.0.1"
description = "Stream a turntable from a Raspberry Pi to Chromecast devices and groups (PoC)"
readme = "README.md"
requires-python = ">=3.11"
# Pinned to the versions verified during development. APIs are checked against
# the installed source when each library is first used (aiohttp: M1, pychromecast: M3).
dependencies = [
    "aiohttp==3.14.5",
    "pychromecast==14.1.1",
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.16.9",
]

[project.scripts]
vinylcast = "vinylcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests poll for conditions and read small files inline on purpose.
"tests/**" = ["ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
